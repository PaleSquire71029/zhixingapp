name: Android Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'artifacts/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'artifacts/**'
  workflow_dispatch:

# Every push/PR runs tests and builds a temporary artifact. Updating the tracked preview APK
# is an explicit manual workflow_dispatch action only; routine source changes never rewrite it.
permissions:
  contents: write

jobs:
  build:
    name: Compile and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Verify Android image resources
        run: python3 scripts/verify_android_resources.py

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assemble Debug APK
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Run Backdrop host interaction test on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest

      - name: Upload Debug APK as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zhixingapp-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit installable preview APK to main repository
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Other documentation/source pushes may advance main while this APK
          # is building. Re-sync before each push attempt to avoid losing the
          # generated APK or failing with a non-fast-forward update.
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            mkdir -p artifacts
            cp app/build/outputs/apk/debug/app-debug.apk artifacts/zhixingapp-preview.apk
            git add artifacts/zhixingapp-preview.apk

            if git diff --cached --quiet; then
              echo "The repository APK is already up to date."
              exit 0
            fi

            git commit -m "build: update Android preview APK [skip ci]"
            if git push origin HEAD:main; then
              echo "Preview APK committed successfully."
              exit 0
            fi

            echo "Push attempt ${attempt} failed; syncing with main and retrying."
          done

          echo "Could not update preview APK after three attempts."
          exit 1
