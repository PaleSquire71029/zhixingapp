name: Android Build

on:
  push:
    branches: [main]
    paths-ignore:
      - 'artifacts/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'artifacts/**'
  workflow_dispatch:

# The main-branch build stores the generated preview APK in the repository.
# Pull-request builds remain read-only because the upload step is push-only.
permissions:
  contents: write

jobs:
  build:
    name: Compile and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and assemble Debug APK
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug

      - name: Upload Debug APK as workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zhixingapp-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Commit installable preview APK to main repository
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/zhixingapp-preview.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/zhixingapp-preview.apk
          if git diff --cached --quiet; then
            echo "The repository APK is already up to date."
          else
            git commit -m "build: update Android preview APK [skip ci]"
            git push
          fi
